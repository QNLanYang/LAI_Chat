<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>AI Chat</title>
    <meta name="description" content="本地优先的静态 AI 聊天客户端">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="vendor/purify.min.js" defer></script>
    <script src="vendor/marked.min.js" defer></script>
    <script src="markdown.js" defer></script>
    <script src="providers.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" aria-label="会话和设置">
            <header class="brand">
                <div>
                    <h1>AI Chat</h1>
                    <p id="statusText">未连接</p>
                </div>
            </header>

            <section class="side-section">
                <div class="section-head">
                    <h2>会话</h2>
                    <button class="ghost-button" type="button" id="newChatButton">新建</button>
                </div>
                <div class="chat-list" id="chatList"></div>
            </section>

            <section class="side-section settings">
                <h2>连接</h2>
                <label>
                    <span>服务</span>
                    <select id="providerSelect">
                        <option value="lmstudio">LM Studio REST v1</option>
                        <option value="ollama">Ollama</option>
                        <option value="openai">OpenAI-compatible</option>
                        <option value="anthropic">Anthropic-compatible</option>
                    </select>
                </label>
                <label id="openaiApiField" hidden>
                    <span>OpenAI API</span>
                    <select id="openaiApiSelect">
                        <option value="chat">Chat Completions</option>
                        <option value="responses">Responses</option>
                    </select>
                </label>
                <label>
                    <span>地址</span>
                    <input id="endpointInput" type="text" inputmode="url" spellcheck="false" autocomplete="off">
                </label>
                <div class="request-preview" id="requestPreview" aria-live="polite"></div>
                <label>
                    <span>模型</span>
                    <div class="model-picker" id="modelPicker">
                        <input id="modelInput" spellcheck="false" autocomplete="off" placeholder="选择或输入模型名">
                        <button class="model-menu-button" type="button" id="modelMenuButton" aria-label="展开模型列表" aria-expanded="false">▾</button>
                        <div class="model-menu" id="modelMenu" hidden></div>
                    </div>
                </label>
                <div class="row-actions">
                    <button class="ghost-button" type="button" id="loadModelsButton">刷新模型</button>
                </div>
                <div class="connection-feedback" id="connectionFeedback" aria-live="polite"></div>
                <label>
                    <span>API Key（本地保存）</span>
                    <input id="apiKeyInput" type="password" spellcheck="false" autocomplete="new-password" placeholder="本地服务通常留空">
                </label>
            </section>

            <section class="side-section settings">
                <h2>参数</h2>
                <label>
                    <span>系统提示</span>
                    <textarea id="systemPromptInput" rows="4" placeholder="可选"></textarea>
                </label>
                <div class="settings-grid">
                    <label>
                        <span>Temperature</span>
                        <input id="temperatureInput" type="number" min="0" max="2" step="0.1">
                    </label>
                    <label>
                        <span>Max tokens</span>
                        <input id="maxTokensInput" type="number" min="1" step="1">
                    </label>
                </div>
                <label>
                    <span>思考模式</span>
                    <select id="reasoningSelect">
                        <option value="auto">自动</option>
                        <option value="off">关闭</option>
                        <option value="minimal">极低</option>
                        <option value="low">低</option>
                        <option value="medium">中</option>
                        <option value="high">高</option>
                        <option value="xhigh">极高</option>
                    </select>
                </label>
                <label class="check-row">
                    <input id="streamCheckbox" type="checkbox">
                    <span>流式输出</span>
                </label>
            </section>

            <footer class="sidebar-footer">
                <button class="ghost-button" type="button" id="exportButton">导出</button>
                <button class="ghost-button danger" type="button" id="clearButton">清空</button>
            </footer>
        </aside>

        <main class="chat-panel" aria-label="聊天">
            <header class="chat-header">
                <div>
                    <p class="eyebrow" id="providerLabel">LM Studio</p>
                    <h2 id="chatTitle">新会话</h2>
                </div>
                <div class="status-pill" id="connectionPill">Local first</div>
            </header>

            <section class="messages" id="messages" aria-live="polite"></section>

            <form class="composer" id="composer">
                <div class="attachment-strip" id="attachmentStrip" hidden></div>
                <textarea id="promptInput" rows="1" placeholder="输入消息..."></textarea>
                <div class="composer-actions">
                    <input id="imageInput" type="file" accept="image/*" multiple hidden>
                    <button class="ghost-button icon-button" type="button" id="attachButton" aria-label="添加图片" title="添加图片">图片</button>
                    <button class="ghost-button" type="button" id="stopButton" disabled>停止</button>
                    <button class="send-button" type="submit" id="sendButton">发送</button>
                </div>
            </form>
        </main>
    </div>
</body>

</html>
