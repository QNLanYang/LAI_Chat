<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>LAI Chat Settings</title>
    <meta name="description" content="LAI Chat 本地 AI 客户端设置">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="providers.js" defer></script>
    <script src="theme.js" defer></script>
    <script src="presets.js" defer></script>
    <script src="settings.js" defer></script>
</head>

<body>
    <div class="settings-shell">
        <header class="page-header">
            <div>
                <p class="eyebrow">LAI Chat · Local first</p>
                <h1>设置</h1>
                <p class="beta-note">测试版，仍在开发中 · © QNLanYang</p>
                <p class="issue-note">欢迎在 GitHub 提交 issues · <a href="https://github.com/QNLanYang/LAI_Chat" target="_blank" rel="noreferrer">🔗Repo</a></p>
            </div>
            <nav class="app-nav" aria-label="应用导航">
                <a href="index.html">聊天</a>
                <a href="images.html">图片</a>
                <a class="is-active" href="settings.html">设置</a>
            </nav>
        </header>

        <main class="settings-page">
            <section class="preset-panel">
                <div class="section-head">
                    <h2>Provider 预设</h2>
                    <div class="segmented-control" role="tablist" aria-label="预设类型">
                        <button class="is-active" type="button" id="chatKindButton">聊天</button>
                        <button type="button" id="imageKindButton">图片</button>
                    </div>
                </div>
                <div class="preset-list" id="presetList"></div>
                <div class="row-actions">
                    <button class="ghost-button" type="button" id="addPresetButton">新增预设</button>
                    <button class="ghost-button danger" type="button" id="deletePresetButton">删除预设</button>
                </div>
            </section>

            <section class="preset-panel settings">
                <h2>当前预设</h2>
                <label>
                    <span>名称</span>
                    <input id="presetNameInput" spellcheck="false" autocomplete="off">
                </label>
                <label>
                    <span>Provider</span>
                    <select id="presetProviderSelect"></select>
                </label>
                <label>
                    <span>地址</span>
                    <input id="presetEndpointInput" type="text" inputmode="url" spellcheck="false" autocomplete="off">
                </label>
                <label>
                    <span>模型</span>
                    <input id="presetModelInput" spellcheck="false" autocomplete="off">
                </label>
                <label id="presetOpenAiApiField">
                    <span>OpenAI API</span>
                    <select id="presetOpenAiApiSelect">
                        <option value="chat">Chat Completions</option>
                        <option value="responses">Responses</option>
                    </select>
                </label>
                <label>
                    <span>API Key（本地 localStorage）</span>
                    <input id="presetApiKeyInput" type="password" spellcheck="false" autocomplete="new-password">
                </label>
                <div class="request-preview" id="presetPreview" aria-live="polite"></div>
                <div class="connection-feedback" id="settingsFeedback" aria-live="polite"></div>
            </section>
        </main>
    </div>
</body>

</html>
